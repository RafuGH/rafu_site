<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ページが見つかりません | RAFU</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0c10">
<!-- このページは、サイトの中のどのURLで間違えても出る。画像やリンクが正しく開くように、サイトの置き場所をここに書く
     （独自ドメインに引っ越したら href="/" に変える） -->
<base href="/rafu_site/">
<link rel="icon" href="assets/img/favicon-32.png?v=20261101" sizes="32x32" type="image/png">
<link rel="icon" href="assets/img/favicon-192.png?v=20261101" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=20261101">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap">
<style>
  :root { --ink: #0c0c10; --tomato: #e5121b; --yellow: #ffe03a; color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; overflow: hidden;
    background: var(--ink); color: #fff;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-weight: 700; line-height: 1.7;
  }
  /* 赤い集中線と、斜めの黒い帯 */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(circle at 50% 42%, #ff5236, var(--tomato) 38%, #8f0910); }
  .bg::before { content: ""; position: absolute; left: 50%; top: 42%; width: 240vmax; height: 240vmax; margin: -120vmax 0 0 -120vmax; background: repeating-conic-gradient(rgba(255,236,200,.16) 0 5deg, transparent 5deg 12deg); animation: spin 90s linear infinite; }
  .bg::after { content: ""; position: absolute; inset: 58% -10% -20% -10%; background: var(--ink); transform: skewY(-6deg); transform-origin: 0 0; box-shadow: 0 -8px 0 #000; }
  @keyframes spin { to { transform: rotate(360deg); } }
  main { position: relative; width: min(100%, 640px); padding: 24px max(20px, env(safe-area-inset-right)) 32px max(20px, env(safe-area-inset-left)); text-align: center; }
  .tomato { position: relative; display: inline-block; width: clamp(150px, 38vw, 230px); }
  .tomato img { display: block; width: 100%; height: auto; filter: drop-shadow(8px 10px 0 rgba(0,0,0,.35)); animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } }
  .pop { position: absolute; right: -34%; top: 2%; font-weight: 900; font-size: clamp(20px, 5vw, 28px); color: #fff; -webkit-text-stroke: 6px #000; paint-order: stroke fill; transform: rotate(12deg); }
  h1 { margin: 6px 0 0; font-weight: 900; font-size: clamp(84px, 24vw, 150px); line-height: 1; letter-spacing: .02em; font-style: italic; color: #fff; text-shadow: 6px 6px 0 #000, 10px 10px 0 var(--yellow); }
  .lead { margin: 14px 0 0; display: inline-block; padding: 4px 18px 6px; background: var(--tomato); font-weight: 900; font-size: clamp(18px, 4.6vw, 24px); transform: skewX(-10deg); box-shadow: 5px 5px 0 #000; }
  .lead span { display: inline-block; transform: skewX(10deg); }
  .text { margin: 18px 0 0; font-size: 14.5px; color: #e6e1ea; text-wrap: pretty; }
  .btns { margin-top: 24px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 18px; }
  .btn { display: inline-block; padding: 12px 26px 13px; font-weight: 900; font-size: 16px; text-decoration: none; transform: skewX(-10deg); box-shadow: 5px 5px 0 #000; transition: transform .2s ease, box-shadow .2s ease; }
  .btn span { display: inline-block; transform: skewX(10deg); }
  .btn-y { background: var(--yellow); color: #000; }
  .btn-w { background: #fff; color: #000; }
  .btn:hover, .btn:focus-visible { transform: skewX(-10deg) translate(-2px, -3px); box-shadow: 8px 9px 0 #000; }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .bg::before, .tomato img { animation: none; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <div class="tomato" aria-hidden="true">
    <img src="assets/img/logo-outline.webp" alt="" width="1024" height="1024">
    <span class="pop">アハハ</span>
  </div>
  <h1>404</h1>
  <p class="lead"><span>ページが見つかりません</span></p>
  <p class="text">URLが変わったか、打ちまちがいかもしれません。<br>トップページか、作品のダウンロードページからどうぞ。</p>
  <div class="btns">
    <a class="btn btn-y" href="./"><span>トップページへ</span></a>
    <a class="btn btn-w" href="downloads.html"><span>作品を見る</span></a>
  </div>
</main>
</body>
</html>
